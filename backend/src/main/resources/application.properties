# ============================================
# MedNex Application Configuration
# ============================================

# Server
server.port=8082
server.servlet.context-path=/api

# ============================================
# MySQL DataSource Configuration
# ============================================
spring.datasource.url=jdbc:mysql://localhost:3306/mednex_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=mednex_user
spring.datasource.password=Mednex@1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=MedNexHikariPool

# ============================================
# FIX 1: Multi-Tenant DataSources
# Schema only has ONE database (mednex_db) ? both tenants point to the same DB.
# Multi-tenancy is achieved via tenant_id column filtering (discriminator pattern),
# NOT separate databases. Pointing to separate DBs that don't exist caused startup errors.
# ============================================
tenant.datasource.tenant_a.url=jdbc:mysql://localhost:3306/mednex_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
tenant.datasource.tenant_a.username=mednex_user
tenant.datasource.tenant_a.password=Mednex@1234

tenant.datasource.tenant_b.url=jdbc:mysql://localhost:3306/mednex_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
tenant.datasource.tenant_b.username=mednex_user
tenant.datasource.tenant_b.password=Mednex@1234

# ============================================
# JPA / Hibernate Configuration
# ============================================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.connection.charSet=UTF-8

# ============================================
# JWT Configuration
# ============================================
app.jwt.secret=MedNexSecretKey2024VeryLongSecretKeyForJWTSigningMustBe256BitsAtLeast
app.jwt.expiration=86400000
app.jwt.refresh-expiration=604800000
app.jwt.header=Authorization
app.jwt.prefix=Bearer

# ============================================
# Logging
# ============================================
logging.level.com.mednex=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.zaxxer.hikari=INFO

# ============================================
# CORS
# ============================================
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# ============================================
# Application
# ============================================
app.name=MedNex Hospital Management System
app.version=1.0.0

# ============================================
# Email Configuration (update with your SMTP)
# ============================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ============================================
# PDF Export Encryption
# ============================================
pdf.encryption.user-password=MedNex@2024
pdf.encryption.owner-password=MedNexOwner@2024
