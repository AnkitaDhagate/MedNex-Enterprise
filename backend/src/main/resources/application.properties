# ============================================
# MedNex Application Configuration
# ============================================

# Server — context-path is /api so all endpoints become /api/...
server.port=8082
server.servlet.context-path=/api

# ============================================
# MySQL DataSource Configuration
# ============================================
spring.datasource.url=jdbc:mysql://localhost:3306/mednex_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=mednex_user
spring.datasource.password=Mednex@1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=MedNexHikariPool

# ============================================
# Tenant DataSources — both point to same DB
# (multi-tenancy via tenant_id column, not separate DBs)
# ============================================
tenant.datasource.tenant_a.url=jdbc:mysql://localhost:3306/mednex_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
tenant.datasource.tenant_a.username=mednex_user
tenant.datasource.tenant_a.password=Mednex@1234

tenant.datasource.tenant_b.url=jdbc:mysql://localhost:3306/mednex_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
tenant.datasource.tenant_b.username=mednex_user
tenant.datasource.tenant_b.password=Mednex@1234

# ============================================
# JPA / Hibernate
# ============================================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.connection.charSet=UTF-8

# FIX: Jackson must serialize LocalDate/LocalTime as strings not arrays
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# ============================================
# JWT Configuration
# ============================================
app.jwt.secret=MedNexSecretKey2024VeryLongSecretKeyForJWTSigningMustBe256BitsAtLeast
app.jwt.expiration=86400000
app.jwt.refresh-expiration=604800000
app.jwt.header=Authorization
app.jwt.prefix=Bearer

# ============================================
# CORS
# ============================================
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# ============================================
# Email — disabled by default (won't block save if SMTP fails)
# ============================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.default-encoding=UTF-8

# ============================================
# Logging
# ============================================
logging.level.com.mednex=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# ============================================
# PDF Export
# ============================================
pdf.encryption.user-password=MedNex@2024
pdf.encryption.owner-password=MedNexOwner@2024

# App info
app.name=MedNex Hospital Management System
app.version=1.0.0
