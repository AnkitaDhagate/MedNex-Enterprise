# ============================================================
# MedNex Enterprise HMS - Application Configuration
# ============================================================

server.port=8082

# ---- Spring Application ----
spring.application.name=mednex-backend
spring.main.allow-bean-definition-overriding=true

# ---- PostgreSQL DataSource ----
spring.datasource.url=jdbc:postgresql://localhost:5432/mednex_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- JPA / Hibernate ----
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# JSONB support
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP

# ---- JWT Configuration (Week 1) ----
jwt.secret=mednex-super-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm
jwt.expiration=86400000

# ---- Multi-Tenant Configuration (Week 1) ----
# Tenant A
tenant.datasource.tenant_a.url=jdbc:postgresql://localhost:5432/mednex_tenant_a
tenant.datasource.tenant_a.username=postgres
tenant.datasource.tenant_a.password=postgres

# Tenant B
tenant.datasource.tenant_b.url=jdbc:postgresql://localhost:5432/mednex_tenant_b
tenant.datasource.tenant_b.username=postgres
tenant.datasource.tenant_b.password=postgres

# ---- Email Configuration (Week 3) ----
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ---- PDF Encryption (Week 4) ----
pdf.encryption.user-password=MedNex@2024
pdf.encryption.owner-password=MedNexOwner@2024

# ---- CORS ----
cors.allowed-origins=http://localhost:3000,http://localhost:3001,http://localhost:4200

# ---- Logging ----
logging.level.com.mednex=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
