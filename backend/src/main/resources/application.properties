# Spring Application
spring.application.name=mednex-backend

# Server Configuration - MAKE SURE THIS PORT IS FREE
server.port=8082
server.address=0.0.0.0
server.error.include-message=always

# Datasource Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/mednex_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=mednex_user
spring.datasource.password=Mednex@1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# JWT Configuration
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000

# Logging Configuration
logging.level.com.mednex=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate=INFO

# Multipart file settings
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB